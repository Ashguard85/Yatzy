name: Yatzy-Release entpacken

on:
  push:
    branches:
      - main
    paths:
      - "uploads/yatzy-duell-*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yatzy-release-unpack
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ZIP prüfen und Versionen entpacken
        run: python3 scripts/unpack_releases.py

      - name: Backend-Syntax prüfen
        run: node --check current/backend/server.js

      - name: Erzeugte Dateien committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions current latest.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen zum Committen."
            exit 0
          fi

          VERSION="$(python3 -c 'import json; print(json.load(open("latest.json"))["version"])')"
          git commit -m "Yatzy Duell ${VERSION} entpacken [skip ci]"
          git push
